services:
  - type: web
    name: headlight-crm
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # waitress is pure-Python (works on any host/Python version)
    startCommand: "waitress-serve --port=$PORT app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRM_PASSWORD
        sync: false      # set a password in the Render dashboard (leave blank for open)
      - key: CRM_DB_PATH
        sync: false      # e.g. /var/data/crm.db  (must live on a persistent disk)
