<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Headlight CRM{% endblock %}</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a2f3a;
      --txt:#e8ecf2; --muted:#9aa3b2; --brand:#f5b301; --brand2:#ffd24a;
      --green:#28c76f; --red:#ff5b6e; --blue:#3aa0ff;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--txt);line-height:1.45;-webkit-text-size-adjust:100%}
    a{color:var(--blue);text-decoration:none}
    header.top{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#1b1e26,#11131a);
      border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 14px}
    header.top .logo{font-weight:800;font-size:17px;letter-spacing:.3px}
    header.top .logo b{color:var(--brand)}
    header.top .spacer{flex:1}
    .nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--panel);
      border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:9}
    .nav a{padding:8px 12px;border-radius:9px;color:var(--muted);font-size:14px;white-space:nowrap;font-weight:600}
    .nav a.active{background:var(--panel2);color:var(--brand)}
    main{padding:16px;max-width:1000px;margin:0 auto;padding-bottom:90px}
    h1{font-size:22px;margin:4px 0 14px}
    h2{font-size:17px;margin:18px 0 10px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
    .stat .k{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px}
    .stat .v{font-size:24px;font-weight:800;margin-top:4px}
    .stat .v.brand{color:var(--brand)} .stat .v.green{color:var(--green)}
    .stat .v.red{color:var(--red)}
    label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
    input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
      color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit}
    textarea{resize:vertical;min-height:70px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
    .btn{display:inline-block;background:var(--brand);color:#11131a;font-weight:800;border:none;
      border-radius:11px;padding:12px 16px;font-size:15px;cursor:pointer;text-align:center}
    .btn.full{width:100%}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:600}
    .btn.red{background:var(--red);color:#fff}
    .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>*{flex:1}
    .list{list-style:none;margin:0;padding:0}
    .li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;
      display:block;color:inherit}
    .li:active{filter:brightness(1.08)}
    .li .t{font-weight:700;font-size:15px}
    .li .s{color:var(--muted);font-size:13px;margin-top:3px}
    .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
    .b-sched{background:#23304a;color:#9cc2ff}
    .b-prog{background:#3a2f12;color:#ffd24a}
    .b-done{background:#133a26;color:#5fe39b}
    .b-cancel{background:#3a1318;color:#ff8d9b}
    .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
    .kv:last-child{border-bottom:none}
    .kv .k{color:var(--muted)}
    .muted{color:var(--muted)}
    .right{text-align:right}
    .flash{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
    .flash.success{background:#133a26;color:#9ff0c0}
    .flash.error{background:#3a1318;color:#ffb3bd}
    .empty{text-align:center;color:var(--muted);padding:40px 10px}
    .fab{position:fixed;bottom:18px;right:18px;z-index:20;width:56px;height:56px;border-radius:50%;
      background:var(--brand);color:#11131a;font-size:30px;font-weight:800;border:none;
      box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--panel2);
      border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;
      transition:opacity .2s;pointer-events:none;z-index:30}
    .toast.show{opacity:1}
    @media(min-width:760px){.nav{justify-content:flex-start}}
  </style>
</head>
<body>
  <header class="top">
    <div class="logo"><b>◉</b> Headlight<b>CRM</b></div>
    <div class="spacer"></div>
    {% if PASSWORD %}
    <a class="btn ghost sm" href="{{ url_for('logout') }}">Logout</a>
    {% endif %}
  </header>
  <nav class="nav">
    <a href="{{ url_for('dashboard') }}" class="{{'active' if request.endpoint=='dashboard'}}">📊 Dashboard</a>
    <a href="{{ url_for('jobs') }}" class="{{'active' if 'job' in request.endpoint}}">🛠 Jobs</a>
    <a href="{{ url_for('customers') }}" class="{{'active' if 'customer' in request.endpoint}}">👥 Customers</a>
  </nav>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in msgs %}
        <div class="flash {{cat}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <div class="toast" id="toast"></div>
  <script>
    function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),1800);}
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
