services:
  - type: web
    name: headlight-crm
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # waitress is pure-Python (works on any host/Python version)
    startCommand: "waitress-serve --port=$PORT app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRM_PASSWORD
        sync: false      # set a password in the Render dashboard (blank = auto-generated)
      - key: DATABASE_URL
        sync: false      # from a Render Postgres instance (internal connection string)
    # No persistent disk needed: data lives in managed Postgres (DATABASE_URL).
